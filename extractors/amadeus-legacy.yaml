name: amadeus-legacy
# Higher than the vendor default so an airline's own extractor wins
# if one ever matches the same message.
order: 60
from_domains:
  - amadeus.com
  - pop3.amadeus.net
# KLM e-tickets, Check My Trip itineraries (`SURNAME/GIVEN DDMMMYYYY
# FROM TO`) and Finnair booking confirmations.
subject_regex: "^(?:KLM e-Ticket \\d{1,2} [A-Za-z]{3} .+|[A-Z][A-Z' -]*/[A-Z][A-Z' -]* \\d{2}[A-Z]{3}\\d{4} [A-Z]{3} [A-Z]{3}|Your confirmation, Booking Ref [A-Z0-9]{6})\\s*$"
requires:
  - html
# These templates predate Amadeus signing its mail (as amadeus.com,
# selector FND2019Q1).
require_dkim:
  - amadeus.com
unsigned_before: "2019-01-01"
