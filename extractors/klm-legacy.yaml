name: klm-legacy
# Higher than the main extractor's 50 so this only runs against
# messages the main one won't touch. Same parser as `klm`, plus a
# message-date cutoff enforced in the script.
order: 60
script: klm-legacy.py
from_domains:
  - klm.com
subject_regex: "(?i)^Confirmation:\\s+.+\\s+\\([A-Z0-9]{5,8}\\)\\s*$"
requires:
  - html
# No `require_dkim`: KLM confirmations up to at least 2019 are
# unsigned. The date cutoff in klm-legacy.py is what actually
# defends the code path.
