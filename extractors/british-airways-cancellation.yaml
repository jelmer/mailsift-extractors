name: british-airways-cancellation
order: 50
# Sent from email.ba.com now and contact.britishairways.com (signed
# by bounce.ba.com) in the mid-2010s.
from_domains:
  - email.ba.com
  - contact.britishairways.com
subject_regex: "(?i)^BA confirmation of cancellation and refund: Ref\\.\\s*[A-Z0-9]{5,8}$"
requires:
  - text
require_dkim:
  - .ba.com
