name: lan
order: 50
# LAN sends from per-country subdomains (`sales@bo.lan.com`) as well
# as the bare domain (`checkinweb@lan.com`).
from_domains:
  - "*.lan.com"
subject_regex: "(?i)^(?:E-Ticket Confirmation|Boarding Pass of .+ \\d{1,2} [a-z]+ \\d{4} .+ - .+ [A-Z0-9]{2} ?\\d{1,4})\\s*$"
requires:
  - html
# LAN didn't sign this mail.
require_dkim:
  - lan.com
  - ".lan.com"
unsigned_before: "2019-01-01"
