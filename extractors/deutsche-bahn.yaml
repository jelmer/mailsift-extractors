name: deutsche-bahn
order: 50
from_domains:
  - bahn.de
  # Confirmations have come from noreply@deutschebahn.com since 2022.
  - deutschebahn.com
# German, English and Dutch confirmations. Cancellations carry no PDF
# and are handled by deutsche-bahn-cancellation.
subject_regex: "(?i)^(?:Vielen Dank für Ihren Fahrkartenkauf!|Buchungsbestätigung|Booking confirmation|Boekingsbevestiging|Deutsche Bahn booking confirmation) \\((?:Auftrag|Order|bestelling|order:) ?[A-Z0-9]+\\)$"
requires:
  - attachment:filename:*.pdf
# bahn.de mail was unsigned until some time in 2018.
require_dkim:
  - bahn.de
  - deutschebahn.com
unsigned_before: "2018-01-01"
